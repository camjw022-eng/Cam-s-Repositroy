<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cam's Highlights — Official Showcase</title>
  <style>
    :root {
      --bg-light: #fbfbfd;
      --bg-alt: #f5f5f7;
      --bg-dark: #000000;
      --surface-light: #ffffff;
      --surface-dark: #161617;
      --text-dark: #1d1d1f;
      --text-muted-light: #6e6e73;
      --text-light: #f5f5f7;
      --text-muted-dark: #86868b;
      --apple-blue: #0071e3;
      --apple-blue-hover: #0077ed;
      --border-light: rgba(0, 0, 0, 0.08);
      --border-dark: rgba(255, 255, 255, 0.14);
      --success: #28cd41;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* Apple Frosted-Glass Global Nav */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 48px;
      background: rgba(22, 22, 23, 0.82);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border-dark);
    }
    .nav-inner {
      max-width: 1024px;
      height: 100%;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: -0.01em;
    }
    .brand {
      color: #f5f5f7;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .nav-links a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #ffffff; }

    /* Ribbon Sub-Banner (Like Apple Store / Event Ribbon) */
    .ribbon {
      background: var(--bg-alt);
      text-align: center;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-dark);
      border-bottom: 1px solid var(--border-light);
    }
    .ribbon a {
      color: var(--apple-blue);
      text-decoration: none;
      font-weight: 500;
    }
    .ribbon a:hover { text-decoration: underline; }

    /* Hero Stage (Inspired by iPhone Pro Dark Showcase) */
    .hero {
      background: radial-gradient(ellipse at 50% 100%, #1d1528 0%, #000000 72%);
      color: var(--text-light);
      text-align: center;
      padding: 68px 20px 60px;
    }
    .eyebrow {
      color: #ff6b8b;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.08;
      margin: 0 0 12px;
      background: linear-gradient(180deg, #ffffff 40%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero .tagline {
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      color: #a1a1a6;
      font-weight: 400;
      max-width: 600px;
      margin: 0 auto 28px;
      letter-spacing: -0.01em;
    }

    /* Apple Pill CTA Buttons */
    .cta-group {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 44px;
    }
    .btn-primary {
      background: var(--apple-blue);
      color: #ffffff;
      text-decoration: none;
      padding: 11px 22px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-primary:hover {
      background: var(--apple-blue-hover);
    }
    .btn-outline {
      background: transparent;
      color: #2997ff;
      border: 1px solid #2997ff;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-outline:hover {
      background: #2997ff;
      color: #ffffff;
    }

    /* Featured Cinema Frame */
    .hero-cinema {
      max-width: 920px;
      margin: 0 auto;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 80px rgba(120, 70, 255, 0.15);
      background: #000;
    }
    .hero-cinema video {
      width: 100%;
      display: block;
    }
    .hero-caption {
      background: #111113;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      text-align: left;
      border-top: 1px solid var(--border-dark);
    }
    .hero-caption h2 {
      margin: 0 0 2px;
      font-size: 17px;
      color: #ffffff;
    }
    .hero-caption p {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted-dark);
    }

    /* Main Showcase Section (Light Apple Product Grid) */
    .showcase-section {
      max-width: 1120px;
      margin: 0 auto;
      padding: 64px 20px 80px;
    }
    .section-head {
      text-align: center;
      margin-bottom: 36px;
    }
    .section-head h2 {
      font-size: clamp(1.9rem, 3.5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      color: var(--text-dark);
    }
    .section-head p {
      color: var(--text-muted-light);
      font-size: 17px;
      margin: 0;
    }

    /* Apple Segmented Control & Search Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      background: var(--bg-alt);
      padding: 10px 14px;
      border-radius: 16px;
    }
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      color: var(--text-dark);
      border: none;
      padding: 7px 16px;
      border-radius: 980px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .filter-btn:hover { background: rgba(0, 0, 0, 0.05); }
    .filter-btn.active {
      background: var(--text-dark);
      color: #ffffff;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 340px;
    }
    .search-box input {
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.12);
      color: var(--text-dark);
      padding: 8px 54px 8px 14px;
      border-radius: 980px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus {
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }
    .search-hint {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--text-muted-light);
      background: var(--bg-alt);
      padding: 1px 7px;
      border-radius: 6px;
      pointer-events: none;
    }
    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted-light);
      cursor: pointer;
      font-size: 14px;
      display: none;
    }

    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--text-muted-light);
    }

    /* Apple 2-Column Bento Product Tiles */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 780px) {
      .gallery { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--surface-light);
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--border-light);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.28s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.09);
    }
    .card.dark-tile {
      background: var(--surface-dark);
      color: var(--text-light);
      border-color: var(--border-dark);
    }
    .card-header {
      padding: 28px 24px 18px;
      text-align: center;
    }
    .card-category {
      font-size: 12px;
      font-weight: 600;
      color: #bf4800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .card.dark-tile .card-category { color: #2997ff; }
    .card-header h3 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }
    .card-header p {
      margin: 0 auto 14px;
      max-width: 380px;
      font-size: 15px;
      color: var(--text-muted-light);
    }
    .card.dark-tile .card-header p { color: var(--text-muted-dark); }

    .card-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      font-size: 14px;
    }
    .apple-link {
      color: var(--apple-blue);
      text-decoration: none;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
    }
    .card.dark-tile .apple-link { color: #2997ff; }
    .apple-link:hover { text-decoration: underline; }
    .apple-link.copied { color: var(--success) !important; }

    .video-wrap {
      position: relative;
      background: #000;
      margin-top: auto;
    }
    .card video {
      width: 100%;
