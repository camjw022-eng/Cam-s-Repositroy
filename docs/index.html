<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cam's Video Highlights</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 10px;
    }
    p.subtitle {
      text-align: center;
      color: #8b949e;
      margin-bottom: 40px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
    }
    video {
      width: 100%;
      display: block;
      background: #000;
    }
    .info {
      padding: 16px;
    }
    .info h3 {
      margin: 0 0 8px 0;
      color: #58a6ff;
      font-size: 1.1rem;
    }
    .info p {
      margin: 0;
      font-size: 0.9rem;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Video Highlights</h1>
    <p class="subtitle">A collection of my best clips and demos</p>

    <div class="gallery">
      <!-- CLIP 1 -->
      <div class="card">
        <video controls preload="metadata">
          <source src="clip1.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <div class="info">
          <h3>Highlight #1</h3>
          <p>Short description of this clip.</p>
        </div>
      </div>

      <!-- CLIP 2 -->
      <div class="card">
        <video controls preload="metadata">
          <source src="clip2.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <div class="info">
          <h3>Highlight #2</h3>
          <p>Short description of this clip.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
